[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hamster-animator"
version = "0.1.0"
description = "Good-looking animations of protoplanetary disks from HAMSTER radiative transfer simulations"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "C0MaE" }]
keywords = ["astrophysics", "radiative transfer", "monte carlo", "protoplanetary disks", "animation", "HAMSTER"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
]
# hamster-tools is intentionally not listed: install it from your HAMSTER checkout (pip install -e .)
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pillow>=9"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[project.scripts]
hamster-animator = "hamster_animator.cli:main"

[project.urls]
Repository = "https://github.com/C0MaE/hamster-animator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "E741"]   # small lambdas and short math names (I, l) are used on purpose

[tool.ruff.lint.isort]
known-first-party = ["hamster_animator"]
